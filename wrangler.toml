# Konfiguracja Cloudflare (Worker serwujący statyczne pliki — Static Assets).
# Projekt podpięty przez Git uruchamia `npx wrangler deploy`, dlatego używamy
# konfiguracji Workers z sekcją [assets], a nie `pages_build_output_dir`.
# Nazwa musi się zgadzać z nazwą projektu w Cloudflare (= nazwa repo),
# inaczej CI nadpisuje ją i próbuje otworzyć PR z poprawką.
name = "duzepieniadze"
compatibility_date = "2024-11-01"

[assets]
# Katalog z buildem (npm run build → dist).
directory = "./dist"
# SPA: każde nieznane żądanie (np. /admin, /konto) dostaje index.html z 200,
# dzięki czemu React Router obsłuży trasę zamiast zwracać 404.
not_found_handling = "single-page-application"
